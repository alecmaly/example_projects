[project]
name = "mono-app"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "mono-shared",
    "mono-utils",
]

[tool.uv.sources]
mono-shared = { path = "../shared" }
mono-utils  = { path = "../utils" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mono_app"]
